# Isolated machine-only wake runtime.
# Not the Studio site. Do not set this as the Studio publish directory.
# A later Owner pass may create a separate Netlify site from this folder.

[build]
  command = "node scripts/build.mjs"
  publish = "dist/public"

[functions]
  directory = "dist/functions"
  node_bundler = "esbuild"

[functions.wake]
  included_files = ["dist/lib/wake-runtime.mjs"]

# C13: provider rate limit before the function. Available as code-based
# function rateLimit on all Netlify plans (Free allows 2 rules/project).
# dist/functions/wake.mjs stays unbundled so Netlify can parse
# export const config.rateLimit. The Machine handler is imported from
# dist/lib/wake-runtime.mjs and is not a second function.
