<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
html,body{margin:0;padding:0;width:851px;height:315px;overflow:hidden}
.canvas{width:851px;height:315px;position:relative;background:linear-gradient(115deg,#5c7a8a 0%,#c4a574 48%,#2c3e50 100%);color:#fff;font-family:Georgia,serif}
.title{position:absolute;left:28%;top:28%;font-size:36px}
.sub{position:absolute;left:28%;top:52%;font-size:18px;opacity:.92}
.overlap{position:absolute;left:12px;bottom:12px;width:120px;height:120px;border-radius:50%;border:2px dashed rgba(255,255,255,.45)}
.note{position:absolute;right:16px;bottom:10px;font:11px/1.3 system-ui,sans-serif;color:rgba(255,255,255,.65);max-width:46%;text-align:right}
</style></head><body><div class="canvas">
<div class="title">Harbor &amp; Oak Studio</div>
<div class="sub">Facebook Page cover · customer uploads</div>

</div></body></html>
