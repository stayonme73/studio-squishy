<!DOCTYPE html><html><head><meta charset="utf-8"/><style>
html,body{margin:0;padding:0;width:1024px;height:1024px;overflow:hidden;background:#1a2b3c}
.canvas{width:1024px;height:1024px;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,#c4a574 0%,#5c7a8a 55%,#1a2b3c 100%)}
.safe{width:72%;height:72%;border-radius:50%;border:4px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-family:Georgia,serif;text-align:center;padding:8%}
.mark{font-size:42px;letter-spacing:.04em}
.sub{font-size:22px;opacity:.9;margin-top:12px}
.note{position:absolute;bottom:18px;left:0;right:0;text-align:center;font:12px/1.3 system-ui,sans-serif;color:rgba(255,255,255,.55)}
</style></head><body><div class="canvas">
<div class="safe"><div class="mark">Harbor &amp; Oak Studio</div>
<div class="sub">Profile photo</div></div>
<div class="note">Studio 1024×1024 · circular crop safe zone · corners not guaranteed visible</div>
</div></body></html>
